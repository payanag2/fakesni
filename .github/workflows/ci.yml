name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [ debug, release ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APKs
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APKs (unsigned)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease --no-daemon
        env:
          # No signing secrets — produces unsigned release APK
          FAKESNI_STORE_FILE: ''

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.event.inputs.build_type || 'debug' }}-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
